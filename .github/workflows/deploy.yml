name: Deploy (manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: Image tag to deploy
        required: true
        default: ""

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Validate deployment inputs and secret bootstrap
        env:
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "image_tag must be a 40-character commit SHA for an immutable published image" >&2
            exit 1
          fi
          kubectl apply -f deploy/k8s/namespace.yaml
          kubectl apply -f deploy/k8s/config.yaml
          kubectl -n race-tracker get secret race-tracker-secrets >/dev/null
          secret_value() {
            kubectl -n race-tracker get secret race-tracker-secrets -o "jsonpath={.data.$1}" | base64 --decode
          }
          require_secret() {
            local key="$1"
            local value
            value="$(secret_value "$key")"
            if [[ -z "$value" || "$value" == CHANGE_ME* ]]; then
              echo "race-tracker-secrets is missing required key: $key" >&2
              exit 1
            fi
          }
          for key in DB_USERNAME DB_PASSWORD JWT_SECRET; do
            require_secret "$key"
          done
          for service in postgres redis; do
            kubectl -n race-tracker get service "$service" >/dev/null
          done
          config_value() {
            kubectl -n race-tracker get configmap race-tracker-config -o "jsonpath={.data.$1}"
          }
          storage_provider="$(config_value STORAGE_PROVIDER)"
          case "$storage_provider" in
            aws-s3)
              storage_bucket="$(config_value AWS_S3_BUCKET)"
              if [[ -z "$storage_bucket" || "$storage_bucket" == CHANGE_ME* ]]; then
                echo "race-tracker-config must define a real AWS_S3_BUCKET before deployment" >&2
                exit 1
              fi
              require_secret AWS_S3_ACCESS_KEY
              require_secret AWS_S3_SECRET_KEY
              ;;
            minio)
              minio_bucket="$(config_value MINIO_BUCKET)"
              minio_endpoint="$(config_value MINIO_ENDPOINT)"
              if [[ -z "$minio_bucket" || -z "$minio_endpoint" ]]; then
                echo "race-tracker-config must define MINIO_BUCKET and MINIO_ENDPOINT before deployment" >&2
                exit 1
              fi
              require_secret MINIO_ACCESS_KEY
              require_secret MINIO_SECRET_KEY
              ;;
            *)
              echo "Unsupported STORAGE_PROVIDER in race-tracker-config: $storage_provider" >&2
              exit 1
              ;;
          esac

      - name: Apply manifests
        env:
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          manifest_dir="$(mktemp -d)"
          sed "s/REPLACE_WITH_COMMIT_SHA/$IMAGE_TAG/g" deploy/k8s/backend.yaml > "$manifest_dir/backend.yaml"
          sed "s/REPLACE_WITH_COMMIT_SHA/$IMAGE_TAG/g" deploy/k8s/web.yaml > "$manifest_dir/web.yaml"
          kubectl apply -f "$manifest_dir/backend.yaml"
          kubectl apply -f "$manifest_dir/web.yaml"
          kubectl apply -f deploy/k8s/ingress.yaml

      - name: Wait for rollout
        run: |
          kubectl -n race-tracker rollout status deployment/race-tracker-backend --timeout=180s
          kubectl -n race-tracker rollout status deployment/race-tracker-web --timeout=120s
