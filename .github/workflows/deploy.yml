name: Deploy (manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: Image tag to deploy
        required: true
        default: latest

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Apply manifests
        run: |
          kubectl apply -f deploy/k8s/namespace.yaml
          kubectl apply -f deploy/k8s/config.yaml
          kubectl apply -f deploy/k8s/backend.yaml
          kubectl apply -f deploy/k8s/web.yaml
          kubectl apply -f deploy/k8s/ingress.yaml
          kubectl -n race-tracker set image deployment/race-tracker-backend \
            backend=ghcr.io/nkosea07/race-tracker-backend:${{ github.event.inputs.image_tag }}
          kubectl -n race-tracker set image deployment/race-tracker-web \
            web=ghcr.io/nkosea07/race-tracker-web:${{ github.event.inputs.image_tag }}

      - name: Wait for rollout
        run: |
          kubectl -n race-tracker rollout status deployment/race-tracker-backend --timeout=180s
          kubectl -n race-tracker rollout status deployment/race-tracker-web --timeout=120s
