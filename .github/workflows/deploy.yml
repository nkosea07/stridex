name: Deploy (manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: Image tag to deploy
        required: true
        default: ""

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Render and validate deployment manifests
        env:
          AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          MAIL_ENABLED: ${{ vars.MAIL_ENABLED }}
          MAIL_HOST: ${{ vars.MAIL_HOST }}
          MAIL_PORT: ${{ vars.MAIL_PORT }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          DEPLOY_ENVIRONMENT: ${{ github.event.inputs.environment }}
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: python3 deploy/k8s/deployment.py render "$RUNNER_TEMP/race-tracker-manifests"

      - name: Configure kubectl
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Preflight deployment
        run: python3 deploy/k8s/deployment.py preflight "$RUNNER_TEMP/race-tracker-manifests"

      - name: Apply manifests
        run: |
          manifest_dir="$RUNNER_TEMP/race-tracker-manifests"
          kubectl apply -f "$manifest_dir/namespace.yaml"
          kubectl apply -f "$manifest_dir/config.yaml"
          kubectl apply -f "$manifest_dir/backend.yaml"
          kubectl apply -f "$manifest_dir/web.yaml"
          kubectl apply -f "$manifest_dir/ingress.yaml"

      - name: Wait for rollout
        run: |
          kubectl -n race-tracker rollout status deployment/race-tracker-backend --timeout=180s
          kubectl -n race-tracker rollout status deployment/race-tracker-web --timeout=120s
