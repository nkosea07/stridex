spring:
  application:
    name: race-tracker-backend
  config:
    import: optional:file:.env[.properties]
  
  # Database Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:race_tracker}
    username: ${DB_USERNAME:race_admin}
    password: ${DB_PASSWORD:localdevpassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
  
  # Email Configuration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  
  # File Upload
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

# Server Configuration
server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /api

management:
  endpoints:
    enabled-by-default: false
    web:
      base-path: /actuator
      exposure:
        include: health,info,prometheus
  health:
    # Readiness must reflect core runtime dependencies (database, Redis), not SMTP
    # reachability; a transient mail outage should not remove the app from the load balancer.
    mail:
      enabled: false
  endpoint:
    health:
      enabled: true
      probes:
        enabled: true
      show-details: never
    info:
      enabled: true
    prometheus:
      enabled: true
  info:
    defaults:
      enabled: false
    build:
      enabled: true

info:
  app:
    name: race-tracker-backend
    description: Backend service for Race/Marathon Tracking Platform

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 900000      # 15 minutes
  refresh-token-expiration: 604800000   # 7 days

# CORS Configuration
cors:
  allowed-origins:
    - http://localhost:5173    # Vite dev server
    - http://localhost:8082    # Mobile web dev server
    - http://localhost:3000    # Alternative dev server
    - ${FRONTEND_URL:http://localhost:5173}
  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - PATCH
    - OPTIONS
  allowed-headers:
    - Authorization
    - Content-Type
    - Accept
    - X-Requested-With
    - Origin
    - Access-Control-Request-Method
    - Access-Control-Request-Headers
    - X-CSRF-Token
    - X-RFID-Reader-Key
    - Idempotency-Key
  allow-credentials: true

# WebSocket Configuration
websocket:
  allowed-origins:
    - http://localhost:5173
    - ${FRONTEND_URL:http://localhost:5173}

# Logging
logging:
  level:
    root: INFO
    com.racetracker: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Race Tracker Custom Configuration
racetracker:
  # Object storage objects remain private. The current media API intentionally loads bytes
  # through the backend; signed URL delivery requires a future API contract change.
  storage:
    provider: ${STORAGE_PROVIDER:local}
    upload-dir: ${STORAGE_UPLOAD_DIR:uploads}
    aws:
      enabled: ${AWS_S3_ENABLED:false}
      bucket: ${AWS_S3_BUCKET:}
      region: ${AWS_S3_REGION:us-east-1}
      endpoint: ${AWS_S3_ENDPOINT:}
      access-key: ${AWS_S3_ACCESS_KEY:}
      secret-key: ${AWS_S3_SECRET_KEY:}
      path-style-access: ${AWS_S3_PATH_STYLE_ACCESS:false}
    minio:
      enabled: ${MINIO_ENABLED:false}
      bucket: ${MINIO_BUCKET:}
      region: ${MINIO_REGION:us-east-1}
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:}
      secret-key: ${MINIO_SECRET_KEY:}
      path-style-access: ${MINIO_PATH_STYLE_ACCESS:true}
  security:
    trusted-proxies: ${TRUSTED_PROXIES:}
  auth:
    browser-cookie-secure: ${BROWSER_COOKIE_SECURE:false}
  oauth:
    enabled: true
  mfa:
    encryption-key: ${MFA_ENCRYPTION_KEY:}
  bib:
    qr-code-size: 200
    default-prefix: "RT"
  tracking:
    gps-update-interval-seconds: 5
    checkpoint-radius-meters: 50
    accuracy-threshold-meters: ${TRACKING_ACCURACY_THRESHOLD_METERS:100}
    max-plausible-speed-kmh: ${TRACKING_MAX_PLAUSIBLE_SPEED_KMH:60}
    smoothing-factor: ${TRACKING_SMOOTHING_FACTOR:0.4}
    min-distance-for-accumulation-meters: ${TRACKING_MIN_DISTANCE_METERS:5}
    max-track-points: ${TRACKING_MAX_TRACK_POINTS:1000}
    heatmap-scale: ${TRACKING_HEATMAP_SCALE:3}
  email:
    enabled: ${MAIL_ENABLED:false}
    from-address: ${MAIL_FROM:noreply@racetracker.com}
    from-name: "Race Tracker Platform"
    frontend-base-url: ${FRONTEND_URL:http://localhost:5173}
    verification-path: /verify-email
    reset-password-path: /reset-password
  push:
    enabled: ${PUSH_ENABLED:false}
    service-account-json: ${FCM_SERVICE_ACCOUNT_JSON:}
    project-id: ${FCM_PROJECT_ID:}
  notifications:
    sms-enabled: ${SMS_ENABLED:false}
    whatsapp-enabled: ${WHATSAPP_ENABLED:false}
  privacy:
    deletion-grace-days: ${PRIVACY_DELETION_GRACE_DAYS:30}
  payments:
    enabled: ${PAYMENTS_ENABLED:false}
    base-url: ${PESEPAY_BASE_URL:https://api.test.sandbox.pesepay.com/payments-engine/v1}
    integration-key: ${PESEPAY_INTEGRATION_KEY:}
    encryption-key: ${PESEPAY_ENCRYPTION_KEY:}
    currency: ${PAYMENTS_CURRENCY:USD}
    result-url: ${PAYMENTS_RESULT_URL:}
    return-url: ${PAYMENTS_RETURN_URL:}
  rfid:
    simulation-enabled: ${RFID_SIMULATION_ENABLED:true}
    stream-key: ${RFID_STREAM_KEY:race.rfid.ingest}
    consumer-group: ${RFID_CONSUMER_GROUP:race-tracker-rfid}
    consumer-name: ${RFID_CONSUMER_NAME:${spring.application.name}}
    worker-batch-size: ${RFID_WORKER_BATCH_SIZE:50}
    worker-poll-timeout-millis: ${RFID_WORKER_POLL_TIMEOUT_MILLIS:1000}
    worker-fixed-delay-millis: ${RFID_WORKER_FIXED_DELAY_MILLIS:500}
    recovery-fixed-delay-millis: ${RFID_RECOVERY_FIXED_DELAY_MILLIS:5000}
    reader-silence-timeout-seconds: ${RFID_READER_SILENCE_TIMEOUT_SECONDS:120}
    gateway-backlog-degraded-threshold: ${RFID_GATEWAY_BACKLOG_DEGRADED_THRESHOLD:100}
  api:
    version: 1
  seed:
    default-admin:
      enabled: false
    local-users:
      enabled: ${LOCAL_TEST_USERS_ENABLED:false}
      race-admin-email: ${LOCAL_RACE_ADMIN_EMAIL:}
      race-admin-password: ${LOCAL_RACE_ADMIN_PASSWORD:}
      official-email: ${LOCAL_OFFICIAL_EMAIL:}
      official-password: ${LOCAL_OFFICIAL_PASSWORD:}
      volunteer-email: ${LOCAL_VOLUNTEER_EMAIL:}
      volunteer-password: ${LOCAL_VOLUNTEER_PASSWORD:}

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

logging:
  level:
    com.racetracker: DEBUG

racetracker:
  storage:
    provider: ${STORAGE_PROVIDER:local}
    aws:
      enabled: ${AWS_S3_ENABLED:false}
    minio:
      enabled: ${MINIO_ENABLED:false}
  auth:
    browser-cookie-secure: true
  oauth:
    enabled: true
  rfid:
    simulation-enabled: true
  seed:
    default-admin:
      enabled: true
    local-users:
      enabled: ${LOCAL_TEST_USERS_ENABLED:false}

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

cors:
  allowed-origins:
    - ${FRONTEND_URL}

websocket:
  allowed-origins:
    - ${FRONTEND_URL}

logging:
  level:
    root: WARN
    com.racetracker: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN

racetracker:
  auth:
    browser-cookie-secure: true
  oauth:
    enabled: false
  rfid:
    simulation-enabled: false
  seed:
    default-admin:
      enabled: false
    local-users:
      enabled: false
