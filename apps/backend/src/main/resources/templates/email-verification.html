<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Verify your account</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #eee; }
        .header { background: #2563EB; color: white; padding: 10px; text-align: center; }
        .content { padding: 20px; }
        .button { display: inline-block; padding: 10px 20px; background: #2563EB; color: white; text-decoration: none; border-radius: 5px; }
        .footer { font-size: 12px; color: #777; margin-top: 20px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Race Tracker</h1>
        </div>
        <div class="content">
            <p>Hello <span th:text="${firstName}">User</span>,</p>
            <p>Welcome to Race Tracker! Please verify your account by clicking the button below:</p>
            <p style="text-align: center;">
                <a th:href="${verificationLink}" class="button">Verify Account</a>
            </p>
            <p>If the button doesn't work, you can copy and paste this link into your browser:</p>
            <p th:text="${verificationLink}">link</p>
            <p>Thank you,<br/>The Race Tracker Team</p>
        </div>
        <div class="footer">
            &copy; 2026 Race Tracker Platform. All rights reserved.
        </div>
    </div>
</body>
</html>
