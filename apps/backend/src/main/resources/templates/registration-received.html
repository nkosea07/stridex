<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{email.registrationReceived.subject(${raceName})}">Race Tracker</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #eee; }
        .header { background: #2563EB; color: white; padding: 10px; text-align: center; }
        .content { padding: 20px; }
        .footer { font-size: 12px; color: #777; margin-top: 20px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Race Tracker</h1>
        </div>
        <div class="content">
            <p th:text="#{email.common.greeting(${firstName})}">Hello</p>
            <p th:text="#{email.registrationReceived.intro(${raceName})}">Received</p>
            <p th:text="#{email.registrationReceived.next}">Next</p>
            <div th:if="${checkInQr}" style="text-align: center; margin: 16px 0;">
                <img src="cid:checkInQr" width="200" height="200" alt="Check-in QR code" th:alt="#{email.checkInQr.alt}"/>
                <p th:text="#{email.checkInQr.caption}">Show this code at check-in.</p>
            </div>
            <p><span th:text="#{email.common.thanks}">Thank you,</span><br/><span th:text="#{email.common.team}">The Race Tracker Team</span></p>
        </div>
        <div class="footer" th:text="#{email.common.footer}">Race Tracker Platform</div>
    </div>
</body>
</html>
