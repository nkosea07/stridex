apiVersion: apps/v1
kind: Deployment
metadata:
  name: race-tracker-backend
  namespace: race-tracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: race-tracker-backend
  template:
    metadata:
      labels:
        app: race-tracker-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/nkosea07/race-tracker-backend:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: race-tracker-config
            - secretRef:
                name: race-tracker-secrets
          readinessProbe:
            httpGet:
              path: /api/actuator/health/readiness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/actuator/health/liveness
              port: 8081
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests:
              cpu: "500m"
              memory: "768Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: race-tracker-backend
  namespace: race-tracker
spec:
  selector:
    app: race-tracker-backend
  ports:
    - port: 8081
      targetPort: 8081
